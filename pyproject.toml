[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The bare "grounded" was already taken
# (adieyal/grounded v1.1.0), so the sibling naming pattern used by
# fc0web/grounding-check was extended here. The importable module and
# CLI command are still `grounded`.
name = "grounded-check"
version = "0.1.2"
description = "Check that generated text is actually supported by its sources. Deterministic, offline, no model."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nobuki Fujimoto" }]
keywords = [
    "hallucination", "grounding", "verification", "citation", "provenance",
    "llm", "ai", "fact-checking", "offline", "mcp", "audit-trail",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Deliberately empty. The checker is pure standard library.
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
grounded = "grounded.cli:main"
grounded-mcp = "grounded.mcp_server:main"

[project.urls]
Homepage = "https://github.com/fc0web/grounded"
Issues = "https://github.com/fc0web/grounded/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded"]

[tool.pytest.ini_options]
testpaths = ["tests"]
